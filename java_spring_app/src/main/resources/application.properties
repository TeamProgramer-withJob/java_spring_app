spring.application.name=its

spring.thymeleaf.prefix=file:src/main/resources/templates/
spring.datasource.data-source-class-name=org.h2.Driver
# Optional: keep the database open after the last connection closes
spring.datasource.url=jdbc:h2:mem:its;DB_CLOSE_DELAY=-1;MODE=MySQL;DB_CLOSE_ON_EXIT=FALSE
#spring.datasource.url=jdbc:h2:mem:its;DB_CLOSE_ON_EXIT=TRUE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
#spring.sql.init.encoding=UTF-8 

spring.datasource.initialize=true 
spring.sql.init.schema-locations=classpath:schema.sql 
spring.sql.init.data-locations=classpath:data.sql 

# Defer script execution until after Hibernate initializes
spring.jpa.defer-datasource-initialization=true

# Allow Hibernate to create the schema from entities
# create or update for existing schemas
spring.jpa.hibernate.ddl-auto=update

# Ensure the initialization mode is set to always (default for embedded DBs, needed for others)
# For Spring Boot >= 2.5.0
spring.sql.init.mode=always
# For Spring Boot < 2.5.0 (the original property in your question)
# spring.datasource.initialization-mode=always

# max file size - default 1MB
spring.servlet.multipart.max-file-size=10MB
# max request size - default 10MB
spring.servlet.multipart.max-request-size=25MB

spring.jpa.open-in-view=false

#spring.devtools.restart.enabled=false # default is true

spring.main.banner-mode=off
#logging.level.root=warn
#logging.level.org.hibernate.SQL=debug
#logging.level.org.hibernate.orm.jdbc.bind=trace
#logging.level.org.springframework.aop=debug

# Optional: customize the console URL path
spring.h2.console.path=/h2-console
spring.h2.console.enabled=true

