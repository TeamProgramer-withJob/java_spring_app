<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>プラン一覧</title>
</head>
<body>
<label class="page-title">料金プラン一覧</label>
<div class="mt-3 page-top-btn">
    <a href="./plan-form.html" class="btn btn-primary" th:href="@{/admin/plans/new}">新しい料金プラン</a>
</div>

<table class="table table-striped table-hover" style="margin-top:30px;">
  <thead>
  <tr>
    <th width="30%;">料金プラン名</th>
    <th width="100px;">価格</th>
    <th>備考</th>
    <th width="100px;">登録日</th>
    <th width="80px;"></th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="plan : ${page.getContent()}">
    <td>
      <a href="./plan-detail" th:href="@{/admin/plans/edit/{id}(id=${plan.id}, page=${page.number})}" th:text="${plan.name}">(料金プラン)</a>
    </td>
    <td th:text="${plan.price}">(料金)</td>
    <td th:text="${plan.remark}">(備考)</td>
    <td th:text="${#temporals.format(plan.createdAt, 'yyyy/MM/dd', 'Asia/Tokyo')}">(登録日)</td>
    <td>
      <a href="./plan-detail" class="btn btn-danger" th:href="@{/admin/plans/delete/{id}(id=${plan.id}, page=${page.number})}"
            th:attr="data-plan-name=${plan.name}"
            onclick="return confirm('Are you sure you want to delete this plan ' + this.dataset.planName + ' ?');">削除</a>
    </td>
  </tr>
  </tbody>
</table>

<nav aria-label="Page navigation">
  <ul class="pagination justify-content-end gap-1">
    <li class="page-item">
      <a class="page-link" th:href="@{/admin/plans(page=0)}" aria-label="First"><span aria-hidden="true">&laquo;</span></a>
    </li>
    
    <li class="page-item" th:each="i : ${#numbers.sequence(idxStart, idxEnd)}" th:classappend="${page.number+1==i} ? 'active'">
      <a class="page-link rounded" th:href="@{/admin/plans(page=${i-1})}" th:text="${i}">1</a>
    </li>
    
    <li class="page-item">
      <a class="page-link" th:href="@{/admin/plans(page=${page.totalPages-1})}" aria-label="Last"><span aria-hidden="true">&raquo;</span></a>
    </li>
  </ul>
</nav>
</body>
</html>
