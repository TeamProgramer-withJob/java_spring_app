<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title th:text="${memory.title} + ' | 結びの霊園'">思い出詳細 | 結びの霊園</title>
</head>
<body>
<div class="mt-4">

    <nav aria-label="breadcrumb" class="mb-3">
        <ol class="breadcrumb">
            <li class="breadcrumb-item"><a th:href="@{/cemeteries}">霊園一覧</a></li>
            <li class="breadcrumb-item">
                <a th:href="@{/cemeteries/{id}(id=${cemetery.id})}" th:text="${cemetery.name}"></a>
            </li>
            <li class="breadcrumb-item active" th:text="${memory.title}"></li>
        </ol>
    </nav>

    <div class="card mb-4">
        <div class="card-body">
            <h2 class="card-title" th:text="${memory.title}"></h2>
            <p class="text-muted small mb-3"
               th:text="${memory.authorDisplayName} + ' さん • ' + ${#temporals.format(memory.createdAt, 'yyyy年MM月dd日')}"></p>

            <div th:if="${memory.imageContentType != null}" class="mb-3">
                <img th:src="@{/cemeteries/{cid}/memories/{mid}/image(cid=${cemetery.id},mid=${memory.id})}"
                     alt="思い出の画像"
                     class="img-fluid rounded"
                     style="max-height: 400px;">
            </div>

            <p class="card-text" style="white-space: pre-wrap;" th:text="${memory.body}"></p>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/cemeteries/{id}(id=${cemetery.id})}">← [[${cemetery.name}]] に戻る</a>
    </div>
</div>
</body>
</html>
