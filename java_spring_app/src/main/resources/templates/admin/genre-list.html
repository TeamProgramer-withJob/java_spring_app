<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>ジャンル一覧</title>
</head>
<body>
<label class="page-title">ジャンル一覧</label>
<div class="mt-3 page-top-btn">
    <a href="./plan-form.html" class="btn btn-primary" th:href="@{/admin/genres/new}">新しいジャンル</a>
</div>

<table class="table table-striped table-hover" style="margin-top:30px;">
  <thead>
  <tr>
    <th>タイトル</th>
    <th width="100px;">登録日</th>
    <th width="80px;"></th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="genre : ${page.getContent()}">
    <td>
      <a href="./genre-detail" th:href="@{/admin/genres/edit/{id}(id=${genre.id}, page=${page.number})}" th:text="${genre.title}">(ジャンル)</a>
    </td>
    <td th:text="${#temporals.format(genre.createdAt, 'yyyy/MM/dd', 'Asia/Tokyo')}">(登録日)</td>
    <td>
      <a href="./genre-detail" class="btn btn-danger" th:href="@{/admin/genres/delete/{id}(id=${genre.id}, page=${page.number})}"
            th:attr="data-title=${genre.title}"
            onclick="return confirm('Are you sure you want to delete this plan ' + this.dataset.title + ' ?');">削除</a>
    </td>
  </tr>
  </tbody>
</table>

<nav aria-label="Page navigation">
  <ul class="pagination justify-content-end gap-1">
    <li class="page-item">
      <a class="page-link" th:href="@{/admin/genres(page=0)}" aria-label="First"><span aria-hidden="true">&laquo;</span></a>
    </li>
    
    <li class="page-item" th:each="i : ${#numbers.sequence(idxStart, idxEnd)}" th:classappend="${page.number+1==i} ? 'active'">
      <a class="page-link rounded" th:href="@{/admin/genres(page=${i-1})}" th:text="${i}">1</a>
    </li>
    
    <li class="page-item">
      <a class="page-link" th:href="@{/admin/genres(page=${page.totalPages-1})}" aria-label="Last"><span aria-hidden="true">&raquo;</span></a>
    </li>
  </ul>
</nav>
</body>
</html>
