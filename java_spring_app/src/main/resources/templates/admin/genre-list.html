<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>ユーザー一覧 | 課題管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">ジャンル一覧</h1>
<br>
<a href="./genre-form.html" th:href="@{/admin/genres/new}">新しいジャンル</a>
<br><br>
<table class="table">
  <thead>
  <tr>
    <th>タイトル</th>
    <th>登録日</th>
    <th></th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="genre : ${page.getContent()}">
    <td>
      <a href="./genre-detail" th:href="@{/admin/genres/edit/{id}(id=${genre.id}, page=${page.number})}" th:text="${genre.title}">(ジャンル)</a>
    </td>
    <td th:text="${#temporals.format(genre.createdAt, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')}">(登録日)</td>
    <td>
      <a href="./genre-detail" th:href="@{/admin/genres/delete/{id}(id=${genre.id}, page=${page.number})}">削除</a>
    </td>
  </tr>
  </tbody>
</table>

<nav aria-label="Page navigation">
  <ul class="pagination">
    <li class="page-item">
      <a class="page-link" th:href="@{/admin/genres(page=0)}">First</a>
    </li>
    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
      <a class="page-link" th:unless="${page.first}" th:href="@{/admin/genres(page=${page.number-1})}">previous</a>
    </li>
    <li class="page-item" th:each="i : ${#numbers.sequence(idxStart, idxEnd)}" th:classappend="${page.number+1==i} ? 'active'">
      <a class="page-link" th:href="@{/admin/genres(page=${i-1})}" th:text="${i}">1</a>
    </li>
    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
      <a class="page-link" th:unless="${page.last}" th:href="@{/admin/genres(page=${page.number+1})}">next</a>
    </li>
    <li class="page-item">
      <a class="page-link" th:href="@{/admin/genres(page=${page.totalPages-1})}">Last</a>
    </li>
  </ul>
</nav>

</body>
</html>
