<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>アクセス権限がありません | 結びの霊園</title>
</head>
<body>
<div class="row justify-content-center mt-5">
    <div class="col-md-6 text-center">
        <p class="display-1 fw-bold text-secondary">403</p>
        <h1 class="h3 mb-3">アクセスが制限されています</h1>
        <p class="text-muted mb-4"
           th:text="${errorMessage}">この操作を行う権限がありません。別のアカウントでログインするか、以下の導線からお戻りください。</p>
        <div class="d-flex justify-content-center gap-2">
            <a th:href="@{/}" class="btn btn-outline-secondary">ホームへ戻る</a>
            <a th:href="@{/cemeteries}" class="btn btn-primary">霊園一覧へ</a>
        </div>
    </div>
</div>
</body>
</html>
