<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>ユーザー編集 | 課題管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">ユーザープロファイル編集</h1>
<div th:if="${error}">
  <p th:text="${error}"></p>
  <p th:text="${message}"></p>
</div>
<div th:unless="${error}">
  <form action="#" th:action="@{/admin/users/update/{id}(id=${data.id}, page=${pageNo})}" th:method="put" th:object="${data}">
    <input type="hidden" name="email" th:value="${data.email}" />
    <div class="mt-3 col-md-4">
        <label for="usernameInput" class="form-label">ユーザー名</label>
        <input type="text" id="usernameInput" th:field="*{name}" class="form-control"
               th:classappend="${#fields.hasErrors('name')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">(error)</p>
    </div>
	<div>
	  <p><span>電子メール</span>: <span th:text="*{email}">(電子メール)</span></p>
	</div>
    <div class="mt-3 col-md-4">
        <label for="passwordInput" class="form-label">パスワード</label>
        <input type="password" id="passwordInput" th:field="*{password}" class="form-control"
               th:classappend="${#fields.hasErrors('password')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">(error)</p>
    </div>
    <div class="mt-3 col-md-4">
        <label for="passwordInput2" class="form-label">パスワード確認</label>
        <input type="password" id="passwordInput2" th:field="*{password2}" class="form-control"
               th:classappend="${#fields.hasErrors('password2')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('password2')}" th:errors="*{password2}">(error)</p>
    </div>
    <div class="mt-3 col-md-6">
        <label for="roleInput" class="form-label">ロール</label>
        <select id="roleInput" th:field="*{role}" class="form-select" style="width: 120px" th:disabled="${#authorization.expression('hasRole(''USER'')')}"
               th:classappend="${#fields.hasErrors('role')} ? is-invalid">
          <option th:each="role : ${allRoles}" th:value="${role.id}" th:text="${role.name}" >(role name)</option>
        </select>
        <p class="invalid-feedback" th:if="${#fields.hasErrors('role')}" th:errors="*{role}">(error)</p>
    </div>
    <div class="mt-3 col-md-6">
        <input type="checkbox" id="validInput" th:field="*{valid}" class="form-check-input" th:disabled="${#authorization.expression('hasRole(''USER'')')}" />
        <label for="validInput" class="form-check-label">有効にする</label>
    </div>
    <div class="mt-3 col-md-6">
        <input type="checkbox" id="forcePwdChangeInput" th:field="*{forcePwdChange}" class="form-check-input" th:disabled="${#authorization.expression('hasRole(''USER'')')}" />
        <label for="forcePwdChangeInput" class="form-check-label">パスワードを強制変更にする</label>
    </div>
    <div th:if="${data.subscriptionId}" class="mt-3 col-md-6">
      <p>購入したプラン： <span th:text="*{planId}">(plan id)</span></p>
    </div>
    <div class="mt-3 col-md-6">
      <p>Created at <span th:text="${#temporals.format(data.createdAt, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')}">(createdAt)</span></p>
    </div>
    <br>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">更新</button>
    </div>
  </form>
</div>
</body>
</html>
