<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>問合せ | 課題管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">課題管理アプリケーション</h1>
    <div th:if="${error}">
        <div class="alert alert-danger col-xs-offset-1 col-xs-10" >
            <label th:text="${error}"></label>
        </div>
    </div>

	<form action="#" th:action="${isEdit} ? @{/admin/plans/edit/{id}(id=*{id}, page=${page})} : @{/admin/plans}" th:method="${isEdit} ? 'put' : 'post'" th:object="${plan}">
    <div class="mt-3 col-md-6">
        <label for="nameInput" class="form-label">料金プラン名</label>
        <input type="text" id="nameInput" name="name" th:field="*{name}" class="form-control"
                    th:classappend="${#fields.hasErrors('name')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">(error)</p>
    </div>
    <div class="mt-3 col-md-6">
        <label for="priceInput" class="form-label">料金</label>
        <input type="number" id="priceInput" name="price" th:field="*{price}" class="form-control"
                    th:classappend="${#fields.hasErrors('price')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}">(error)</p>
    </div>
    <div class="mt-3 col-md-6">
        <label for="remarkInput" class="form-label">料金</label>
        <textarea id="remarkInput" name="remark" th:field="*{remark}" class="form-control" rows="3"
                    th:classappend="${#fields.hasErrors('remark')} ? is-invalid"></textarea>
        <p class="invalid-feedback" th:if="${#fields.hasErrors('remark')}" th:errors="*{remark}">(error)</p>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">送信</button>
    </div>
</form>
</body>
</html>
