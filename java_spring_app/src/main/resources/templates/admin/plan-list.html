<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>ユーザー一覧 | 課題管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">料金プラン一覧</h1>
<br>
<a href="./plan-form.html" th:href="@{/admin/plans/new}">新しい料金プラン</a>
<br><br>
<table class="table">
  <thead>
  <tr>
    <th>料金プラン名</th>
    <th>価格</th>
    <th>備考</th>
    <th>登録日</th>
    <th></th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="plan : ${page.getContent()}">
    <td>
      <a href="./plan-detail" th:href="@{/admin/plans/edit/{id}(id=${plan.id}, page=${page.number})}" th:text="${plan.name}">(料金プラン)</a>
    </td>
    <td th:text="${plan.price}">(料金)</td>
    <td th:text="${plan.remark}">(備考)</td>
    <td th:text="${#temporals.format(plan.createdAt, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')}">(登録日)</td>
    <td>
      <a href="./plan-detail" th:href="@{/admin/plans/delete/{id}(id=${plan.id}, page=${page.number})}">削除</a>
    </td>
  </tr>
  </tbody>
</table>

<nav aria-label="Page navigation">
  <ul class="pagination">
    <li class="page-item">
      <a class="page-link" th:href="@{/admin/plans(page=0)}">First</a>
    </li>
    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
      <a class="page-link" th:unless="${page.first}" th:href="@{/admin/plans(page=${page.number-1})}">previous</a>
    </li>
    <li class="page-item" th:each="i : ${#numbers.sequence(idxStart, idxEnd)}" th:classappend="${page.number+1==i} ? 'active'">
      <a class="page-link" th:href="@{/admin/plans(page=${i-1})}" th:text="${i}">1</a>
    </li>
    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
      <a class="page-link" th:unless="${page.last}" th:href="@{/admin/plans(page=${page.number+1})}">next</a>
    </li>
    <li class="page-item">
      <a class="page-link" th:href="@{/admin/plans(page=${page.totalPages-1})}">Last</a>
    </li>
  </ul>
</nav>

</body>
</html>
