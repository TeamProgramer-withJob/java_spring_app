<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>サインアップ</title>
</head>
<body>
<label class="page-title">氏名、パスワードと電子メールを入力して会員登録を行います</label>
    <div th:if="${param.error}">
        <div class="alert alert-danger col-xs-offset-1 col-xs-10" >
            Failed to sign-up. Please check your inputs.
        </div>
    </div>

	<form action="#" th:action="@{/signup}" th:method="post" th:object="${data}">
    <div class="mt-3 col-md-4">
        <label for="usernameInput" class="form-label">ユーザー名</label>
        <input type="text" id="usernameInput" th:field="*{name}" class="form-control"
               th:classappend="${#fields.hasErrors('name')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">(error)</p>
    </div>

    <div class="mt-3 col-md-4">
        <label for="passwordInput" class="form-label">パスワード</label>
        <input type="password" id="passwordInput" th:field="*{password}" class="form-control"
               th:classappend="${#fields.hasErrors('password')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">(error)</p>
    </div>
    <div class="mt-3 col-md-4">
        <label for="passwordInput2" class="form-label">パスワード確認</label>
        <input type="password" id="passwordInput2" th:field="*{password2}" class="form-control"
               th:classappend="${#fields.hasErrors('password2')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('password2')}" th:errors="*{password2}">(error)</p>
    </div>

    <div class="mt-3 col-md-4">
        <label for="emailInput" class="form-label">電子メール</label>
        <input type="text" id="emailInput" th:field="*{email}" class="form-control"
               th:classappend="${#fields.hasErrors('email')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('email')}" th:errors="*{email}">(error)</p>
    </div>

    <div class="mt-3">
        <button type="submit" class="btn btn-primary">サインアップ</button>
    </div>
</form>
</body>
</html>
