<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>お問い合わせ一覧</title>
</head>
<body>
<h1 class="mt-3">お問い合わせ一覧</h1>
<a href="../index.html" th:href="@{/}">トップページ</a>
<a href="./contactForm.html" th:href="@{/inquiries/contactForm}">作成</a>
<table class="table">
  <thead>
  <tr>
    <th>#</th>
    <th>件名</th>
    <th>メッセージ</th>
  </tr>
  </thead>
  <tbody>
    <tr th:each="inquiry : ${inquiryList}">
        <td th:text="${inquiry.id}"></td>
        <td th:text="${inquiry.subject}"></td>
        <td th:text="${inquiry.message}"></td>
    </tr>
  </tbody>
</table>
</body>
</html>
