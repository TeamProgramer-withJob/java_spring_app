<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>問合せ | 課題管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">課題管理アプリケーション</h1>
    <div th:if="${error}">
        <div class="alert alert-danger col-xs-offset-1 col-xs-10" >
            <label th:text="${error}"></label>
        </div>
    </div>

	<form action="#" th:action="${isEdit} ? @{/admin/genres/edit/{id}(id=*{id}, page=${page})} : @{/admin/genres}" th:method="${isEdit} ? 'put' : 'post'" th:object="${genre}">
    <div class="mt-3 col-md-6">
        <label for="titleInput" class="form-label">ジャンル</label>
        <input type="text" id="titleInput" name="title" th:field="*{title}" class="form-control"
                    th:classappend="${#fields.hasErrors('title')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">(error)</p>
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">送信</button>
    </div>
</form>
</body>
</html>
