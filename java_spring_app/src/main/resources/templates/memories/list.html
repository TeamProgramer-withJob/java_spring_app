<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>思い出一覧</title>
</head>
<body>
<label class="page-title">思い出一覧</label>
<div class="mt-3 page-top-btn">
    <a href="./inquiry-form.html" th:href="@{/memories/new}"><button type="submit" class="btn btn-primary">思い出投稿</button></a>
</div>

<table class="table table-striped table-hover" style="margin-top:30px;">
  <thead>
  <tr>
    <th width="20%">タイトル</th>
    <th width="30%">詳細</th>
    <th>画像</th>
    <th width="150px;"></th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="memo : ${page.getContent()}">
    <td>
      <a href="./detail.html" th:href="@{/memories/{memoId}(memoId=${memo.id}, page=${page.number})}" th:text="${memo.title}">
        (details)
      </a>
    </td>
    <td th:text="${memo.details}">(title)</td>
    <td>
      <p th:text="${memo.filename}">(filename)</p>
    </td>
    <td>
      <a href="./edit/id" th:href="@{/memories/edit/{id}(id=${memo.id}, (page=${page.number}))}" class="btn btn-warning">編集</a> 
      <a href="./delete/id" th:href="@{/memories/delete/{id}(id=${memo.id}, (page=${page.number}))}" onclick="return confirm('本当に削除してもよろしいですか？');" 
   class="btn btn-danger">削除</a>
    </td>
  </tr>
  </tbody>
</table>

<nav aria-label="Page navigation">
  <ul class="pagination justify-content-end gap-1">
    <li class="page-item">
      <a class="page-link" th:href="@{/memories(page=0)}" aria-label="First"><span aria-hidden="true">&laquo;</span></a>
    </li>
    
    <li class="page-item" th:each="i : ${#numbers.sequence(idxStart, idxEnd)}" th:classappend="${page.number+1==i} ? 'active'">
      <a class="page-link rounded" th:href="@{/memories(page=${i-1})}" th:text="${i}">1</a>
    </li>
    
    <li class="page-item">
      <a class="page-link" th:href="@{/memories(page=${page.totalPages-1})}" aria-label="Last"><span aria-hidden="true">&raquo;</span></a>
    </li>
  </ul>
</nav>
</body>
</html>
