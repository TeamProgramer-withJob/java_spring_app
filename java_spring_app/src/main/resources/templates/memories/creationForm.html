<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>思い出投稿</title>
</head>
<body>
<label class="page-title" th:unless="${data.act=='image'}" th:text="|${data.act == 'update' ? '思い出を編集' : '新しい思い出を投稿'}します|"></label>
<label class="page-title" th:if="${data.act=='image'}" th:text="画像を追加します"></label>

<form style="margin-top:30px;" action="#" th:action="@{/memories(page=${pageNo})}" th:method="post" th:object="${data}" enctype="multipart/form-data">
    <input type="text" id="inputId" th:field="*{id}" th:value="*{id}" hidden="true">
    <input type="text" id="inputAct" th:field="*{act}" th:value="*{act}" hidden="true">
    <div class="mt-3 col-md-8" th:if="*{act} != 'image'">
        <label for="titleInput" class="form-label">タイトル</label>
        <input type="text" id="titleInput" th:field="*{title}" class="form-control"
               th:classappend="${#fields.hasErrors('title')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">(error)</p>
    </div>
    <div th:if="*{act} == 'image'">
      <input type="text" id="titleInput" th:field="*{title}" hidden="true">
    </div>

    <div class="mt-3 col-md-8" th:if="*{act} != 'image'">
        <label for="descriptionInput" class="form-label">思い出の詳細</label>
        <textarea id="detailsInput" rows="10" th:field="*{details}" class="form-control"
                  th:classappend="${#fields.hasErrors('details')} ? is-invalid"></textarea>
        <p class="invalid-feedback" th:if="${#fields.hasErrors('details')}" th:errors="*{details}">(error)</p>
    </div>
    <div th:if="*{act} == 'image'">
      <input type="text" id="detailsInput" th:field="*{details}" hidden="true">
    </div>
    
    <div class="mt-3 col-md-3">
        <label for="fileUpload" class="form-label" th:text="*{act == 'image' ? '画像追加':'画像'}">画像</label>
        <input type="file" id="fileUpload" th:field="*{file}" class="form-control"
                  th:classappend="${#fields.hasErrors('file')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('file')}" th:errors="*{file}">(error)</p>
    </div>
    <div class="mt-3 page-bottom-btn">
        <button type="submit" class="btn btn-primary" th:unless="${data.act=='image'}" th:text="${act == 'update' ? '更新' : '登録'}">(作成)</button>
        <button type="submit" class="btn btn-primary" th:if="${data.act=='image'}" th:text="追加">(作成)</button>
        <span style="margin-right: 15px;"></span>
        <a href="./list.html" th:href="@{/memories(page=${pageNo})}" class="btn btn-secondary">キャンセル</a>
    </div>
</form>
</body>
</html>
