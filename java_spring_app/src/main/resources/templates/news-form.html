<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>ニュース投稿</title>
</head>
<body>
<label class="page-title">新しいニュースを投稿します</label>
<div th:if="${error}">
  <p th:text="${error}"></p>
  <p th:text="${message}"></p>
</div>

<div th:unless="${error}" style="margin-top:30px;">
  <form action="#" th:action="${isEdit} ? @{/admin/news/edit/{id}(id=*{id}, page=${page})} : @{/admin/news}" th:method="${isEdit} ? 'put' : 'post'" th:object="${news}">
    <div class="mt-3 col-md-6">
        <label for="titleInput" class="form-label">タイトル</label>
        <input type="text" id="titleInput" th:field="*{title}" class="form-control"
               th:classappend="${#fields.hasErrors('title')} ? is-invalid">
        <p class="invalid-feedback" th:if="${#fields.hasErrors('title')}" th:errors="*{title}">(error)</p>
    </div>
    <div class="mt-3 col-md-6">
        <label for="infoInput" class="form-label">タイトル</label>
        <textarea id="titleInput" rows="5" cols="50" th:field="*{information}" class="form-control"
               th:classappend="${#fields.hasErrors('information')} ? is-invalid"></textarea>
        <p class="invalid-feedback" th:if="${#fields.hasErrors('information')}" th:errors="*{information}">(error)</p>
    </div>
    <div class="mt-3 col-md-6">
        <label for="genreInput" class="form-label">ジャンル</label>
        <select id="genreInput" th:field="*{genreId}" class="form-select" style="width: 240px"
               th:classappend="${#fields.hasErrors('genreId')} ? is-invalid">
          <option th:each="genre : ${genres}" th:value="${genre.id}" th:text="${genre.name}" >(genre title)</option>
        </select>
        <p class="invalid-feedback" th:if="${#fields.hasErrors('genreId')}" th:errors="*{genreId}">(error)</p>
    </div>

    <div class="mt-3 col-md-6" th:if="${isEdit}">
      <p>Created at <span th:text="${#temporals.format(news.createdAt, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')}">(createdAt)</span></p>
    </div>
    <div class="mt-3 page-bottom-btn">
        <button type="submit" class="btn btn-primary" th:text="${isEdit ? '更新' : '投稿'}">(update)</button>
    </div>
  </form>
</div>
</body>
</html>
