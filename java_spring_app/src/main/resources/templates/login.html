<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>ログイン</title>
</head>
<body>
<label class="page-title">会員の方はログインしてください</label>
<br>
    <div th:if="${param.error}">
        <div class="alert alert-danger col-xs-offset-1 col-xs-10" >
            <label th:text="${message} ? ${message} : #{error.login.failed}"></label>
        </div>
    </div>
    <div th:if="${param.logout}">
        <div class="alert alert-danger col-xs-offset-1 col-xs-10" >
            <label th:text="#{user.logout.success}"></label>
        </div>
    </div>

	<form action="#" th:action="@{/authenticateTheUser}" method="post">
    <div class="mt-3 col-md-4">
        <label for="usernameInput" class="form-label">電子メール</label>
        <input type="text" id="usernameInput" name="username" class="form-control">
    </div>
    <div class="mt-3 col-md-4">
        <label for="passwordInput" class="form-label">パスワード</label>
        <input type="password" id="passwordInput" name="password" class="form-control">
    </div>
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">ログイン</button>
    </div>
</form>
<br>
<div>まだ会員になっていない方は、こちらで<span><a th:href="@{/signup}">サインアップ</a></span>してください。</div>
</body>
</html>
