<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>トップニュース</title>
</head>
<body>
<div class="container-fluid p-0">
  <img src="/images/its_news_banner.jpg" class="img-fluid w-100" alt="main banner">
</div>

<div class="modal fade" id="newsModal" tabindex="-1">
  <div class="modal-dialog">
	<div class="modal-content" id="newsDetail">
	</div>
  </div>
</div>

<div id="news-container" th:attr="hx-get=@{/news/list(page=${pageNo}, all=${all}, auto=${auto})}" hx-trigger="load" hx-swap="innerHTML">Loading ...</div>

<div class="d-flex" style="margin-bottom:30px;" th:if="${#authorization.expression('hasRole(''ADMIN'')')}">
	<label class="ms-auto">新しいニュースを<span><a th:href="@{/admin/news}">投稿</a></span>します。</label>
</div>
<script>
  document.addEventListener('click', async function (event) {
    const link = event.target.closest('a[data-modal]');
    if (!link) return;
    event.preventDefault();

    const url = link.getAttribute('href');
    const modalId = link.dataset.modal;
    const modalElement = document.getElementById(modalId);

    if (!modalElement || !url) {
        console.error('Modal or URL not found:', modalId, url);
        return;
    }

    const contentElement = modalElement.querySelector('.modal-content');
    try {
        const response = await fetch(url);
        if (!response.ok) {
            throw new Error('Failed to load news detail: ' + response.status);
        }

        const html = await response.text();
        contentElement.innerHTML = html;

        bootstrap.Modal.getOrCreateInstance(modalElement).show();
    } catch (error) {
        console.error(error);
        alert('Unable to load the news detail.');
    }
  });
</script>
<script th:inline="javascript">
	const autoScroll = /*[[${auto}]]*/ false;
	
	window.addEventListener('htmx:afterSwap', function () {
		  const target = document.getElementById('news-container');
	
		  if (autoScroll && target) {
			  target.scrollIntoView({
		          behavior: 'smooth',
		          block: 'start'
		      });
		  }
	});
</script>
<script src="https://cdn.jsdelivr.net/npm/htmx.org@2.0.11/dist/htmx.min.js" 
      integrity="sha384-2OatzQy1H+Zd/IIrjr1TcuDGqLXeHhbooAyJY1KdQMKnr4LZ22k31GBLdYKHmVjg"
      crossorigin="anonymous"></script>
</body>
</html>
