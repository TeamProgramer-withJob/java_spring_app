<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>霊園を作成 | 結びの霊園</title>
</head>
<body>
<div class="row justify-content-center mt-4">
    <div class="col-md-7">
        <h2 class="mb-4">霊園ページを作成する</h2>

        <form th:action="@{/cemeteries}" th:object="${cemeteryForm}" method="post">

            <div class="mb-3">
                <label for="name" class="form-label">霊園名 <span class="text-danger">*</span></label>
                <input type="text" id="name" th:field="*{name}"
                       class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'"
                       placeholder="例：田中家の思い出">
                <div class="invalid-feedback" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">説明（任意）</label>
                <textarea id="description" th:field="*{description}" rows="4"
                          class="form-control" th:classappend="${#fields.hasErrors('description')} ? 'is-invalid'"
                          placeholder="この霊園について説明してください"></textarea>
                <div class="invalid-feedback" th:errors="*{description}"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">作成する</button>
                <a th:href="@{/cemeteries}" class="btn btn-outline-secondary">キャンセル</a>
            </div>
        </form>
    </div>
</div>
</body>
</html>
