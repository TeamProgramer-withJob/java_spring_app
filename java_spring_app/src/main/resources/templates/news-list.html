<div class="container my-5" xmlns:th="http://www.thymeleaf.org" th:fragment="newsList">
    <h2 class="mb-4">最新ニュース</h2>

    <div class="list-group list-group-flush">
        <article th:each="news : ${page.getContent()}" class="list-group-item py-4">
            <small class="text-muted" th:text="${#temporals.format(news.createdAt, 'yyyy/MM/dd HH:mm', 'Asia/Tokyo')}">(title)</small>
            <span th:if="${news.createdAt.isAfter(T(java.time.OffsetDateTime).now().minusDays(3))}" class="badge bg-danger">New</span>
            <h5 class="mt-2 mb-2" th:if="${#strings.length(news.information) > 128}">
                <a th:href="@{/news/detail/{id}(id=${news.id})}" class="text-decoration-none text-dark"
                   data-modal="newsModal" th:text="${news.title}"></a>
            </h5>
            <h5 class="mt-2 mb-2" th:unless="${#strings.length(news.information) > 128}">
                <span class="text-decoration-none text-dark" th:text="${news.title}"></span>
            </h5>
            <p class="mb-0 text-secondary" th:text="${#strings.length(news.information) > 128 ? #strings.substring(news.information, 0, 128)+'...' : news.information}"></p>
        </article>
    </div>

    <div class="text-end mt-3" th:unless="${showAll}">
        <a th:href="@{/news/list?all}" class="btn btn-outline-primary"
           hx-get="/news/list?all" hx-target="#news-container" hx-swap="innerHTML">View All News</a>
    </div>

	<nav aria-label="Page navigation" th:if="${showAll}">
	  <ul class="pagination justify-content-end gap-1">
	    <li class="page-item">
	      <a th:href="@{/news/list(page=0, all)}" class="page-link" aria-label="First"
	         th:attr="hx-get=@{/news/list(page=0, all)}" hx-target="#news-container" hx-swap="innerHTML"><span aria-hidden="true">&laquo;</span></a>
	    </li>
	    
	    <li class="page-item" th:each="i : ${#numbers.sequence(idxStart, idxEnd)}" th:classappend="${page.number+1==i} ? 'active'">
	      <a th:href="@{/news/list(page=${i-1}, all)}" class="page-link rounded" th:text="${i}"
	         th:attr="hx-get=@{/news/list(page=${i-1}, all)}" hx-target="#news-container" hx-swap="innerHTML">1</a>
	    </li>
	    
	    <li class="page-item">
	      <a th:href="@{/news(page=${page.totalPages-1}, all)}" class="page-link" aria-label="Last"
	         th:attr="hx-get=@{/news/list(page=${page.totalPages-1}, all)}" hx-target="#news-container" hx-swap="innerHTML"><span aria-hidden="true">&raquo;</span></a>
	    </li>
	  </ul>
	</nav>
	
</div>
