<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>思い出</title>
</head>
<body>
<div class="page-top-link">
  <a href="./list.html" th:href="@{/memories(page=${pageNo})}">一覧に戻る</a>
</div>

<div class="card shadow-sm" th:object="${memo}">
    <div class="card-header bg-white">
        <h5 class="mb-0">思い出</h5>
    </div>

    <div class="card-body p-0">
        <ul class="list-group list-group-flush">
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">タイトル</div>
                    <div class="col-sm-10" th:text="*{title}">（タイトル）</div>
                </div>
            </li>
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">思い出</div>
                    <div class="col-sm-10" th:text="*{details}">（思い出詳細）</div>
                </div>
            </li>
            <li class="list-group-item py-3" th:if="${#lists.size(memo.imgIds) > 0}" th:each="imgId : ${memo.imgIds}">
				<div style="vertical-align: top;">
				    <img th:src="@{/memories/image/{imageId}(imageId=${imgId})}" style="width:640px; height:auto;" th:alt="|画像${imgId}|" />
				    <a th:href="@{/memories/image/delete/{id}(id=${imgId}, page=${pageNo})}" onclick="return confirm('画像を削除してもよろしいですか?');">
				      <button type="button" class="btn btn-danger">
				        <i class="bi bi-trash"></i>削除
				      </button>
				    </a>
				</div>
            </li>
            <li class="list-group-item py-3">
				<p th:text="|投稿日： ${#temporals.format(memo.createdAt, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')} 最後更新日：${#temporals.format(memo.lastUpdated, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')}|"></p>
            </li>
        </ul>
    </div>
</div>

<div style="display:flex; gap:20px;margin-top:30px;margin-bottom:50px;">
  <form th:action="@{/memories/like/{memId}(memId=${memo.id}, page=${pageNo})}" method="post">
    <button type="submit" class="btn btn-outline-primary">
      <i class="bi bi-hand-thumbs-up">いいね！</i>
    </button>
  </form>
  <a th:href="@{/memories/image/{memId}/add(memId=${memo.id}, page=${pageNo})}">
    <button type="submit" class="btn btn-outline-primary">
      <i class="bi bi-hand-thumbs-up">画像を追加</i>
    </button>
  </a>
</div>
<div style="margin-top:-30px; margin-bottom:50px;">
	<span th:if="${#lists.size(memo.thumbups) > 0}" th:text="| Total： ${#lists.size(memo.thumbups)} 件|">Total: 0</span>
</div>
</body>
</html>
