<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>問合せ一覧 | 課題管理アプリケーション</title>
</head>
<body>
<h1 class="mt-3">問合せ一覧</h1>
<a href="./inquiry-form.html" th:href="@{/inquiries/new}">新しい問合せ</a>
<br>
<table class="table">
  <thead>
  <tr>
    <th>投稿日時</th>
    <th>件名</th>
    <th>問合せ詳細</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="inquiry : ${page.getContent()}">
    <td th:text="${#temporals.format(inquiry.createdAt, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')}">(2026/02/28)</td>
    <td>
      <div th:if="${#authorization.expression('isAuthenticated()') and (#authorization.expression('hasRole(''ADMIN'')') or #authentication.principal.username == inquiry.email) or #authorization.expression('isAnonymous()') and not inquiry.emailExist}">
        <a th:href="@{/inquiries/{id}(id=${inquiry.id}, page=${page.number})}" th:text="${inquiry.subject}">
          (subject)
        </a>
      </div>
      <div th:unless="${#authorization.expression('isAuthenticated()') and (#authorization.expression('hasRole(''ADMIN'')') or #authentication.principal.username == inquiry.email) or #authorization.expression('isAnonymous()') and not inquiry.emailExist}" th:text="${inquiry.subject}">
          (subject)
      </div>
    </td>
    <td>
      <div th:if="${#authorization.expression('isAuthenticated()') and (#authorization.expression('hasRole(''ADMIN'')') or #authentication.principal.username == inquiry.email)}" th:text="${inquiry.message}">
      </div>
      <div th:if="${#authorization.expression('isAnonymous()') or not (#authorization.expression('hasRole(''ADMIN'')') or #authentication.principal.username == inquiry.email)}">
          -
      </div>
    </td>
  </tr>
  </tbody>
</table>

<nav aria-label="Page navigation">
  <ul class="pagination">
    <li class="page-item" th:classappend="${page.first} ? 'disabled'">
      <a class="page-link" th:unless="${page.first}" th:href="@{/inquiries(page=${page.number-1})}">previous</a>
      <!--  span class="page-item" th:if="${page.first}">previous</span -->
    </li>
    
    <li class="page-item" th:each="i : ${#numbers.sequence(idxStart, idxEnd)}" th:classappend="${page.number+1==i} ? 'active'">
      <a class="page-link" th:href="@{/inquiries(page=${i-1})}" th:text="${i}">1</a>
    </li>
    
    <li class="page-item" th:classappend="${page.last} ? 'disabled'">
      <a class="page-link" th:unless="${page.last}" th:href="@{/inquiries(page=${page.number+1})}">next</a>
      <!--  span th:if="${page.last}">next</span -->
    </li>
  </ul>
</nav>

</body>
</html>
