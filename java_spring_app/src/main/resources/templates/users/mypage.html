<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>マイページ | 結びの霊園</title>
</head>
<body>
<div class="mt-4">

    <!-- プロフィール -->
    <div class="card mb-4">
        <div class="card-body">
            <h3 class="card-title mb-1" th:text="${user.displayName}"></h3>
            <p class="text-muted small mb-2" th:text="'@' + ${user.username}"></p>
            <p class="mb-3" th:text="${user.bio}" th:if="${user.bio != null and !user.bio.isEmpty()}"></p>
            <div class="d-flex gap-4 text-center">
                <div>
                    <div class="fw-bold" th:text="${followingCount}">0</div>
                    <div class="text-muted small">フォロー中</div>
                </div>
                <div>
                    <div class="fw-bold" th:text="${followerCount}">0</div>
                    <div class="text-muted small">フォロワー</div>
                </div>
                <div>
                    <div class="fw-bold" th:text="${#lists.size(myCemeteries)}">0</div>
                    <div class="text-muted small">霊園</div>
                </div>
                <div>
                    <div class="fw-bold" th:text="${#lists.size(myMemories)}">0</div>
                    <div class="text-muted small">思い出</div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自分の霊園一覧 -->
    <div class="mb-5">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h4 class="mb-0">自分の霊園</h4>
            <a th:href="@{/cemeteries/new}" class="btn btn-sm btn-primary">＋ 霊園を作成する</a>
        </div>

        <div th:if="${#lists.isEmpty(myCemeteries)}" class="text-muted">
            まだ霊園を作成していません。
        </div>

        <div class="row g-3" th:unless="${#lists.isEmpty(myCemeteries)}">
            <div class="col-md-4" th:each="cemetery : ${myCemeteries}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${cemetery.name}"></h5>
                        <p class="card-text text-muted small" th:text="${cemetery.description}"></p>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/cemeteries/{id}(id=${cemetery.id})}"
                           class="btn btn-sm btn-outline-primary">詳細を見る</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 自分の思い出一覧 -->
    <div class="mb-4">
        <h4 class="mb-3">自分の思い出</h4>

        <div th:if="${#lists.isEmpty(myMemories)}" class="text-muted">
            まだ思い出を投稿していません。
        </div>

        <div class="row g-3" th:unless="${#lists.isEmpty(myMemories)}">
            <div class="col-md-4" th:each="memory : ${myMemories}">
                <div class="card h-100">
                    <div th:if="${memory.imageContentType != null}"
                         class="card-img-top overflow-hidden" style="height: 140px;">
                        <img th:src="@{/cemeteries/{cid}/memories/{mid}/image(cid=${memory.cemeteryId},mid=${memory.id})}"
                             alt="思い出の画像"
                             class="img-fluid w-100 h-100"
                             style="object-fit: cover;">
                    </div>
                    <div class="card-body">
                        <h6 class="card-title" th:text="${memory.title}"></h6>
                        <p class="card-text small text-truncate" th:text="${memory.body}"></p>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{/cemeteries/{cid}/memories/{mid}(cid=${memory.cemeteryId},mid=${memory.id})}"
                           class="btn btn-sm btn-outline-primary">詳細を見る</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
</body>
</html>
