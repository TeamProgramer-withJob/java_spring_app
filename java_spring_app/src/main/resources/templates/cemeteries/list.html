<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>霊園一覧 | 結びの霊園</title>
</head>
<body>
<div class="mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>霊園ページ一覧</h2>
        <a th:href="@{/cemeteries/new}" class="btn btn-primary">＋ 霊園を作成する</a>
    </div>

    <div th:if="${#lists.isEmpty(cemeteries)}" class="text-muted">
        まだ霊園ページがありません。
    </div>

    <div class="row g-3" th:unless="${#lists.isEmpty(cemeteries)}">
        <div class="col-md-4" th:each="cemetery : ${cemeteries}">
            <div class="card h-100">
                <div class="card-body">
                    <h5 class="card-title" th:text="${cemetery.name}"></h5>
                    <p class="card-text text-muted small" th:text="${cemetery.ownerDisplayName} + ' さんの霊園'"></p>
                    <p class="card-text" th:text="${cemetery.description}"></p>
                </div>
                <div class="card-footer">
                    <a th:href="@{/cemeteries/{id}(id=${cemetery.id})}" class="btn btn-sm btn-outline-primary">詳細を見る</a>
                </div>
            </div>
        </div>
    </div>

    <div class="mt-3">
        <a th:href="@{/}">← トップへ戻る</a>
    </div>
</div>
</body>
</html>
