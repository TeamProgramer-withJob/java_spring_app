<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>問合せ詳細</title>
</head>
<body>
<div class="page-top-link">
  <a href="./list.html" th:href="@{/inquiries(page=${pageNo})}">一覧に戻る</a>
</div>

<div class="card shadow-sm" th:object="${inquiry}">
    <div class="card-header bg-white">
        <h5 class="mb-0">問合せの詳細</h5>
    </div>

    <div class="card-body p-0">
        <ul class="list-group list-group-flush">
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">タイトル</div>
                    <div class="col-sm-10" th:text="*{subject}">（タイトル）</div>
                </div>
            </li>
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">問合せ内容</div>
                    <div class="col-sm-10" th:text="*{message}">（タイトル）</div>
                </div>
            </li>
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">問合せ日時</div>
                    <div class="col-sm-4 text-secondary"><span th:text="${#temporals.format(inquiry.createdAt, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')}">(createdAt)</span></div>
                </div>
            </li>
        </ul>
    </div>
</div>

<div class="page-bottom-btn" th:if="${#authorization.expression('isAuthenticated()')}">
  <a th:href="@{/inquiries/edit/{id}(id=${inquiry.id}, page=${pageNo})}" class="btn btn-warning">編集</a>
  <span style="margin-right: 15px;"></span>
  <a th:href="@{/inquiries/delete/{id}(id=${inquiry.id}, page=${pageNo})}" class="btn btn-danger" th:if="${#authorization.expression('hasRole(''ADMIN'')') or #authentication.principal.username == inquiry.email}"
     th:attr="data-title=${inquiry.subject}"
     onclick="return confirm('Are you sure you want to delete this inquiry ' + this.dataset.title + ' ?');">削除</a>
</div>
</body>
</html>
