<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>ログイン | 結びの霊園</title>
</head>
<body>
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <h2 class="mb-4">ログイン</h2>

        <!-- 登録完了メッセージ -->
        <div th:if="${successMessage}" class="alert alert-success" th:text="${successMessage}"></div>

        <!-- ログインエラーメッセージ -->
        <div th:if="${param.error}" class="alert alert-danger">
            ユーザー名またはパスワードが正しくありません
        </div>

        <form th:action="@{/login}" method="post">
            <div class="mb-3">
                <label for="usernameInput" class="form-label">ユーザー名</label>
                <input type="text" id="usernameInput" name="username" class="form-control">
            </div>
            <div class="mb-3">
                <label for="passwordInput" class="form-label">パスワード</label>
                <input type="password" id="passwordInput" name="password" class="form-control">
            </div>
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">ログイン</button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <a th:href="@{/signup}">アカウントをお持ちでない方はこちら（新規登録）</a>
        </div>
    </div>
</div>
</body>
</html>
