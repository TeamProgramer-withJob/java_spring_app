name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: java_spring_app/package-lock.json

      - name: Grant execute permission for Gradle Wrapper
        run: chmod +x ./java_spring_app/gradlew

      - name: Prepare SQLite data directory
        run: mkdir -p ./java_spring_app/data

      - name: Run unit/integration tests
        working-directory: java_spring_app
        run: ./gradlew --no-daemon test

      - name: Install Node dependencies
        working-directory: java_spring_app
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: java_spring_app
        run: npx playwright install --with-deps chromium

      - name: Run Playwright E2E
        working-directory: java_spring_app
        env:
          CI: "true"
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: java_spring_app/playwright-report/
          if-no-files-found: ignore

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: java_spring_app/test-results/
          if-no-files-found: ignore
