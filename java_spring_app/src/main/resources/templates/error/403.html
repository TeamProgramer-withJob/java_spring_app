<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org" lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden</title>
    <style>
        body {
            background-color: #f8f9fa;
            height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .error-card {
            max-width: 800px;
            width: 400px;
            border: none;
            padding: 0px 0px 20px 20px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .error-icon {
            font-size: 2rem;
            color: #dc3545;
        }
    </style>
</head>
<body>

<div class="container text-center">
    <div class="card error-card mx-auto p-1">
	    <div class="card-header bg-white">
	        <h1 class="display-5 fw-bold text-dark mb-2"><span style="color:red;">403</span></h1>
	    </div>

        <div class="card-body">
            <!-- 警告アイコン（簡易的に文字ベースのシールドマーク） -->
            <!--  div class="error-icon mb-3">🛡️❌</div -->
            
            <h2 class="h4 text-muted mb-8">アクセス権限がありません</h2>
            
            <!-- 開発環境用のデバッグ情報（本番環境では非表示にすることを推奨） -->
            <div th:if="${error}" class="text-start bg-light p-3 rounded mb-4 style='font-size: 0.85rem;'">
                <p class="mb-1 text-monospace"><strong>発生日時:</strong> <span th:text="${timestamp}"></span></p>
                <p class="mb-0 text-monospace"><strong>メッセージ:</strong> <span th:text="${message}"></span></p>
            </div>

            <div class="d-grid gap-2">
                <a th:href="@{/}" class="btn btn-primary btn-lg">ホームに戻る</a>
            </div>
        </div>
    </div>
</div>

</body>
</html>
