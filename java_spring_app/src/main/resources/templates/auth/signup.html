<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>会員登録 | 結びの霊園</title>
</head>
<body>
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <h2 class="mb-4">会員登録</h2>

        <!-- エラーメッセージ（重複チェックエラー等） -->
        <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

        <form th:action="@{/signup}" th:object="${signupForm}" method="post">

            <!-- ユーザー名 -->
            <div class="mb-3">
                <label for="username" class="form-label">ユーザー名 <span class="text-danger">*</span></label>
                <input type="text" id="username" th:field="*{username}"
                       class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{username}"></div>
            </div>

            <!-- 表示名 -->
            <div class="mb-3">
                <label for="displayName" class="form-label">表示名 <span class="text-danger">*</span></label>
                <input type="text" id="displayName" th:field="*{displayName}"
                       class="form-control" th:classappend="${#fields.hasErrors('displayName')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{displayName}"></div>
            </div>

            <!-- メールアドレス -->
            <div class="mb-3">
                <label for="email" class="form-label">メールアドレス <span class="text-danger">*</span></label>
                <input type="email" id="email" th:field="*{email}"
                       class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{email}"></div>
            </div>

            <!-- パスワード -->
            <div class="mb-3">
                <label for="password" class="form-label">パスワード <span class="text-danger">*</span></label>
                <input type="password" id="password" th:field="*{password}"
                       class="form-control" th:classappend="${#fields.hasErrors('password')} ? 'is-invalid'">
                <div class="invalid-feedback" th:errors="*{password}"></div>
                <div class="form-text">8文字以上で入力してください</div>
            </div>

            <!-- 自己紹介 -->
            <div class="mb-3">
                <label for="bio" class="form-label">自己紹介（任意）</label>
                <textarea id="bio" th:field="*{bio}" rows="3"
                          class="form-control" th:classappend="${#fields.hasErrors('bio')} ? 'is-invalid'"
                          placeholder="自己紹介を入力してください"></textarea>
                <div class="invalid-feedback" th:errors="*{bio}"></div>
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary">登録する</button>
            </div>
        </form>

        <div class="mt-3 text-center">
            <a th:href="@{/login}">すでにアカウントをお持ちの方はこちら</a>
        </div>
    </div>
</div>
</body>
</html>
