<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{fragments/layout :: layout(~{::title}, ~{::body})}">
<head>
    <title>プロファイル</title>
</head>
<body>
<div class="page-top-link" sec:authorize="hasRole('ADMIN')">
  <a href="./user-list.html" th:href="@{/admin/users(page=${pageNo})}">一覧に戻る</a>
</div>

<div class="card shadow-sm" th:object="${data}">
    <div class="card-header bg-white">
        <h5 class="mb-0">会員プロファイル</h5>
    </div>

    <div class="card-body p-0">
        <ul class="list-group list-group-flush">
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">氏名</div>
                    <div class="col-sm-10" th:text="*{name}">（氏名）</div>
                </div>
            </li>
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">電子メール</div>
                    <div class="col-sm-10" th:text="*{email}">（電子メール）</div>
                </div>
            </li>
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">ロール</div>
                    <div class="col-sm-10" th:switch="*{role}">
                      <span th:case="'ADMIN'">管理者</span>
                      <span th:case="'USER'">一般利用者</span>
                    </div>
                </div>
            </li>
            <li class="list-group-item py-3" th:if="*{subscriptionId}">
                <div class="row">
                    <div class="col-sm-2 text-secondary">契約情報</div>
                    <div class="col col-sm-10 text-secondary">
                      <div>契約番号： <span th:text="*{subscriptionId}">(subscription id)</span></div>
                      <div>加入したプラン： <span th:text="*{spanName}">(plan name)</span></div>
                    </div>
                </div>
            </li>
            <li class="list-group-item py-3" th:unless="*{subscriptionId}">
                <div class="row">
                    <div class="col-sm-2 text-secondary">契約情報</div>
                    <div class="col-sm-10 text-secondary">非会員</div>
                </div>
            </li>
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">状態</div>
                    <div class="col-sm-10 text-secondary">
                      <input type="checkbox" id="opt-valid" th:checked="*{valid}" disabled>
                      <label for="opt-valid" class="text-secondary">有効</label>
                    </div>
                </div>
            </li>
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">強制パスワード変更</div>
                    <div class="col-sm-10 text-secondary">
                      <input type="checkbox" id="opt-forcePwdChg" th:checked="*{forcePwdChange}" disabled>
                    </div>
                </div>
            </li>
            <li class="list-group-item py-3">
                <div class="row">
                    <div class="col-sm-2 text-secondary">登録日時</div>
                    <div class="col-sm-10 text-secondary"><span th:text="${#temporals.format(data.createdAt, 'yyyy/MM/dd HH:mm:ss', 'Asia/Tokyo')}">(createdAt)</span></div>
                </div>
            </li>
        </ul>
    </div>
</div>

<div class="page-bottom-btn">
  <a th:href="@{/admin/users/edit/{id}(id=${data.id}, page=${pageNo})}" class="btn btn-warning">編集</a>
  <span style="margin-right: 15px;"></span>
  <a th:href="@{/admin/users/delete/{id}(id=${data.id}, page=${pageNo})}" class="btn btn-danger" th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
     th:attr="data-user-name=${data.name}"
     onclick="return confirm('Are you sure you want to delete this user' + this.dataset.userName + ' ?');">削除</a>
</div>

</body>
</html>
